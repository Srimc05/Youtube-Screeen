<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Float Tube</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Segoe UI, sans-serif; }
  #bar { height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 6px; background: #1b1b1b; color: #eee;
         -webkit-app-region: drag; }
  #bar > * { -webkit-app-region: no-drag; }
  #bar .spacer { flex: 1; -webkit-app-region: drag; }
  input[type=text] { flex: 3; min-width: 60px; height: 22px; border: 0; border-radius: 4px; padding: 0 6px; background: #333; color: #fff; }
  input[type=range] { width: 70px; }
  button { border: 0; border-radius: 4px; background: #333; color: #eee; height: 22px; cursor: pointer; }
  button:hover { background: #555; }
  #close:hover { background: #c42b1c; }
  webview { position: absolute; top: 32px; bottom: 0; left: 0; right: 0; }
  body.ghost #bar { opacity: .35; }
</style>
</head>
<body>
  <div id="bar">
    <button id="back" title="Back">◀</button>
    <input id="url" type="text" placeholder="Paste YouTube URL or search…">
    <input id="opacity" type="range" min="0.2" max="1" step="0.05" value="1" title="Opacity (Ctrl+Alt+Up/Down)">
    <button id="min" title="Minimize">—</button>
    <button id="close" title="Quit">✕</button>
  </div>
  <webview id="view" src="https://www.youtube.com" allowpopups></webview>
<script>
  const view = document.getElementById('view');
  const url = document.getElementById('url');

  function go(text) {
    text = text.trim();
    if (!text) return;
    if (/^https?:\/\//i.test(text)) view.loadURL(text);
    else if (/^(www\.)?(youtube\.com|youtu\.be)\//i.test(text)) view.loadURL('https://' + text);
    else view.loadURL('https://www.youtube.com/results?search_query=' + encodeURIComponent(text));
  }

  url.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(url.value); });
  view.addEventListener('did-navigate', (e) => { url.value = e.url; });
  view.addEventListener('did-navigate-in-page', (e) => { url.value = e.url; });
  document.getElementById('back').onclick = () => view.canGoBack() && view.goBack();
  document.getElementById('opacity').oninput = (e) => api.setOpacity(parseFloat(e.target.value));
  document.getElementById('min').onclick = () => api.minimize();
  document.getElementById('close').onclick = () => api.close();
  api.onClickThrough((on) => document.body.classList.toggle('ghost', on));
</script>
</body>
</html>
